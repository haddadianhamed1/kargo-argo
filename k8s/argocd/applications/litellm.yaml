apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/part-of: kargo-argocd
spec:
  project: default

  source:
    repoURL: oci://docker.litellm.ai/berriai/litellm-helm
    targetRevision: ""  # Use latest version
    helm:
      valueFiles:
        - $values/k8s/litellm/base/values-bedrock.yaml

  sources:
    - repoURL: oci://docker.litellm.ai/berriai/litellm-helm
      targetRevision: ""
      helm:
        valueFiles:
          - $values/k8s/litellm/base/values-bedrock.yaml
    - repoURL: https://github.com/hamedhaddadian/kargo-argocd
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: litellm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
