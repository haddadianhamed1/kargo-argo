apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fastapi-app-dev
spec:
  hosts:
  - app-dev.hamedstock.com
  gateways:
  - istio-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: fastapi-app
        port:
          number: 80
