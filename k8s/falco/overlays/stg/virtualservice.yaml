apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: falco-stg
  namespace: falco
spec:
  hosts:
  - falco-stg.hamedstock.com
  gateways:
  - falco-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: falco-falcosidekick-ui
        port:
          number: 2802
