name: Claude Code Review

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          track_progress: true
          use_sticky_comment: false

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request briefly.

            Focus on:
            - obvious bugs
            - security risks
            - broken GitHub Actions / Kubernetes / Terraform patterns
            - anything that could break deployment

            Always post one short top-level PR comment using `gh pr comment`.

            If everything looks good, still post a short comment saying:
            "Claude review complete. No major issues found."

            Do not only return the review in the GitHub Actions logs.
            You must post the result to the PR.

          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
