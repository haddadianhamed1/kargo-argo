name: Claude Code Review

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize ]

  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        type: string

  # Comment trigger (@claude mentions)
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC token

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        # Your Anthropic API key (required)
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

        # GitHub token for API access (optional, uses default if not provided)
        github_token: ${{ secrets.GITHUB_TOKEN }}

        # Trigger phrase for comments (optional)
        trigger_phrase: "@claude"

        # Faster execution - disable progress tracking
        track_progress: false

        # Faster execution - disable sticky comments
        use_sticky_comment: false

        # Always provide feedback
        prompt: "Review briefly and always leave a short summary comment, even if everything looks good."
