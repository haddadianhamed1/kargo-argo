name: Claude Code Review

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize ]

  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        type: string

  # Comment trigger (@claude mentions)
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
    - name: Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        # Your Anthropic API key (required)
        anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

        # GitHub token for API access (optional, uses default if not provided)
        github-token: ${{ secrets.GITHUB_TOKEN }}

        # Model to use for review (optional, defaults to claude-3-5-sonnet)
        model: claude-3-5-sonnet-20241022

        # Maximum tokens for review (optional, defaults to 4000)
        max-tokens: 4000

        # Enable code review mode (optional, defaults to true)
        review-mode: true
