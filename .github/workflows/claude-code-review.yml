name: Claude Code Review

on:
  pull_request:
    branches: [ main, master, develop ]
    types: [ opened, synchronize ]

  # Manual trigger
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
        type: string

  # Comment trigger (@claude mentions)
  issue_comment:
    types: [ created ]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # Required for OIDC token

jobs:
  claude-review:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Claude Code Review
      uses: anthropics/claude-code-action@v1
      with:
        # Your Anthropic API key (required)
        anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

        # GitHub token for API access (optional, uses default if not provided)
        github_token: ${{ secrets.GITHUB_TOKEN }}

        # Trigger phrase for comments (optional)
        trigger_phrase: "@claude"

        # Enable progress tracking (optional)
        track_progress: true

        # Use sticky comments for updates (optional)
        use_sticky_comment: true

        # Force review mode (optional)
        prompt: "Please review this pull request for code quality, security, and best practices."
