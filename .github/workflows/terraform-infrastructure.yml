name: 'Terraform Infrastructure'

on:
  push:
    branches:
      - main
      - 'feature/terraform-*'
    paths:
      - 'infrastructure/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.5.7'
  AWS_REGION: 'us-east-1'
  S3_BUCKET: 'github-actions-kargo-argocd'
  DYNAMODB_TABLE: 'terraform-state-lock'

permissions:
  id-token: write   # Required for OIDC
  contents: read
  pull-requests: write
  issues: write

jobs:
  setup-backend:
    name: 'Setup S3 Backend'
    runs-on: ubuntu-latest
    outputs:
      backend-configured: ${{ steps.check-backend.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if S3 backend exists
        id: check-backend
        run: |
          # Check if S3 bucket exists
          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket exists"
            BUCKET_EXISTS=true
          else
            echo "❌ S3 bucket does not exist"
            BUCKET_EXISTS=false
          fi

          # Check if DynamoDB table exists
          if aws dynamodb describe-table --table-name "$DYNAMODB_TABLE" 2>/dev/null; then
            echo "✅ DynamoDB table exists"
            TABLE_EXISTS=true
          else
            echo "❌ DynamoDB table does not exist"
            TABLE_EXISTS=false
          fi

          if [ "$BUCKET_EXISTS" = true ] && [ "$TABLE_EXISTS" = true ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 backend resources
        if: steps.check-backend.outputs.configured == 'false'
        run: |
          echo "🚀 Setting up Terraform S3 backend..."

          # Create S3 bucket
          if ! aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            aws s3 mb "s3://$S3_BUCKET" --region "$AWS_REGION"
            echo "✅ S3 bucket created"

            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$S3_BUCKET" \
              --versioning-configuration Status=Enabled

            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "$S3_BUCKET" \
              --server-side-encryption-configuration '{
                "Rules": [
                  {
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    },
                    "BucketKeyEnabled": false
                  }
                ]
              }'

            # Block public access
            aws s3api put-public-access-block \
              --bucket "$S3_BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

            echo "✅ S3 bucket configured"
          fi

          # Create DynamoDB table
          if ! aws dynamodb describe-table --table-name "$DYNAMODB_TABLE" 2>/dev/null; then
            aws dynamodb create-table \
              --table-name "$DYNAMODB_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5 \
              --region "$AWS_REGION"

            # Wait for table to be active
            aws dynamodb wait table-exists --table-name "$DYNAMODB_TABLE" --region "$AWS_REGION"
            echo "✅ DynamoDB table created"
          fi

  terraform-plan:
    name: 'Terraform Plan'
    needs: setup-backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, stg]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/vpc/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$DYNAMODB_TABLE"

      - name: Terraform Validate
        working-directory: ./infrastructure/terraform/vpc
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform plan \
            -var-file="env/${{ matrix.environment }}.tfvars" \
            -out="${{ matrix.environment }}.tfplan"

      - name: Save Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}
          path: ./infrastructure/terraform/vpc/${{ matrix.environment }}.tfplan
          retention-days: 5

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './infrastructure/terraform/vpc';

            // Run terraform show to get plan output
            const { execSync } = require('child_process');
            try {
              const planOutput = execSync(`cd ${path} && terraform show -no-color ${{ matrix.environment }}.tfplan`, { encoding: 'utf8' });

              const output = `### Terraform Plan (${{ matrix.environment }})

              \`\`\`
              ${planOutput}
              \`\`\`

              <details>
              <summary>Show Plan Details</summary>

              **Environment:** ${{ matrix.environment }}
              **Workspace:** terraform/vpc/${{ matrix.environment }}
              **Backend:** S3 (${process.env.S3_BUCKET})

              </details>`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            } catch (error) {
              console.log('Error running terraform show:', error);
            }

  terraform-apply:
    name: 'Terraform Apply'
    needs: [setup-backend, terraform-plan]
    runs-on: ubuntu-latest
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}
          path: ./infrastructure/terraform/vpc/

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/vpc/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$DYNAMODB_TABLE"

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform apply -auto-approve "${{ github.event.inputs.environment || 'dev' }}.tfplan"

      - name: Save Outputs
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform output -json > outputs.json
          echo "📊 Terraform Outputs:"
          cat outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ github.event.inputs.environment || 'dev' }}
          path: ./infrastructure/terraform/vpc/outputs.json
          retention-days: 30

  terraform-destroy:
    name: 'Terraform Destroy'
    needs: setup-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    environment:
      name: ${{ github.event.inputs.environment }}-destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/vpc/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$DYNAMODB_TABLE"

      - name: Terraform Destroy
        working-directory: ./infrastructure/terraform/vpc
        run: |
          terraform destroy -auto-approve \
            -var-file="env/${{ github.event.inputs.environment }}.tfvars"
