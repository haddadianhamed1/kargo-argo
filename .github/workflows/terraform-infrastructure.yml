name: 'Terraform Infrastructure'

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment for manual deployment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stg
          - prd
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  TF_VERSION: '1.5.7'
  AWS_REGION: 'us-east-1'
  S3_BUCKET: 'github-actions-kargo-argocd'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  setup-backend:
    name: 'Setup S3 Backend'
    runs-on: ubuntu-latest
    outputs:
      backend-configured: ${{ steps.check-backend.outputs.configured }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if S3 backend exists
        id: check-backend
        run: |
          # Check if S3 bucket exists
          if aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "✅ S3 bucket exists"
            BUCKET_EXISTS=true
          else
            echo "❌ S3 bucket does not exist"
            BUCKET_EXISTS=false
          fi

          if [ "$BUCKET_EXISTS" = true ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Create S3 backend resources
        if: steps.check-backend.outputs.configured == 'false'
        run: |
          echo "🚀 Setting up Terraform S3 backend..."

          # Create S3 bucket
          if ! aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            aws s3 mb "s3://$S3_BUCKET" --region "$AWS_REGION"
            echo "✅ S3 bucket created"

            # Enable versioning
            aws s3api put-bucket-versioning \
              --bucket "$S3_BUCKET" \
              --versioning-configuration Status=Enabled

            # Enable encryption
            aws s3api put-bucket-encryption \
              --bucket "$S3_BUCKET" \
              --server-side-encryption-configuration '{
                "Rules": [
                  {
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    },
                    "BucketKeyEnabled": true
                  }
                ]
              }'

            # Block public access
            aws s3api put-public-access-block \
              --bucket "$S3_BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"

            echo "✅ S3 bucket configured"
          fi

  detect-changes:
    name: 'Detect Changed Terraform Modules'
    runs-on: ubuntu-latest
    outputs:
      changed-modules: ${{ steps.detect.outputs.modules }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed terraform modules
        id: detect
        run: |
          # Get changed files compared to main branch or previous commit
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Find terraform modules that have changes
          CHANGED_MODULES=""
          HAS_CHANGES="false"

          for file in $CHANGED_FILES; do
            if [[ $file == infrastructure/terraform/*/*.tf ]]; then
              MODULE_DIR=$(echo $file | cut -d'/' -f1-3)
              MODULE_NAME=$(basename $MODULE_DIR)
              if [[ ! $CHANGED_MODULES =~ $MODULE_NAME ]]; then
                if [ -z "$CHANGED_MODULES" ]; then
                  CHANGED_MODULES="$MODULE_NAME"
                else
                  CHANGED_MODULES="$CHANGED_MODULES,$MODULE_NAME"
                fi
                HAS_CHANGES="true"
              fi
            fi
          done

          echo "Changed modules: $CHANGED_MODULES"
          echo "modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT
          echo "has-changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

  terraform-plan:
    name: 'Terraform Plan'
    needs: [setup-backend, detect-changes]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.target_environment)) || fromJSON('["dev", "stg", "prd"]') }}
        module: ${{ fromJSON(format('[{0}]', needs.detect-changes.outputs.changed-modules)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/${{ matrix.module }}/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Validate
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform plan \
            -var-file="env/${{ matrix.environment }}.tfvars" \
            -out="${{ matrix.environment }}.tfplan"

      - name: Save Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-${{ matrix.environment }}
          path: ./infrastructure/terraform/${{ matrix.module }}/${{ matrix.environment }}.tfplan
          retention-days: 5

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './infrastructure/terraform/${{ matrix.module }}';

            // Run terraform show to get plan output
            const { execSync } = require('child_process');
            try {
              const planOutput = execSync(`cd ${path} && terraform show -no-color ${{ matrix.environment }}.tfplan`, { encoding: 'utf8' });

              const output = `### Terraform Plan (${{ matrix.module }}/${{ matrix.environment }})

              \`\`\`
              ${planOutput}
              \`\`\`

              <details>
              <summary>Show Plan Details</summary>

              **Module:** ${{ matrix.module }}
              **Environment:** ${{ matrix.environment }}
              **Workspace:** terraform/${{ matrix.module }}/${{ matrix.environment }}
              **Backend:** S3 (${process.env.S3_BUCKET})

              </details>`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              });
            } catch (error) {
              console.log('Error running terraform show:', error);
            }

  # Progressive Deployment: Dev Environment (Auto-deploy)
  deploy-dev:
    name: 'Deploy to Development'
    needs: [setup-backend, terraform-plan, detect-changes]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'dev' && github.event.inputs.action == 'apply'))
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.detect-changes.outputs.changed-modules)) }}
    environment:
      name: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-dev
          path: ./infrastructure/terraform/${{ matrix.module }}/

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/${{ matrix.module }}/dev/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform apply -auto-approve dev.tfplan

      - name: Save Outputs
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform output -json > outputs.json
          echo "📊 Development Terraform Outputs (${{ matrix.module }}):"
          cat outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ matrix.module }}-dev
          path: ./infrastructure/terraform/${{ matrix.module }}/outputs.json
          retention-days: 30

  # Progressive Deployment: Staging Environment (Manual approval required)
  deploy-staging:
    name: 'Deploy to Staging'
    needs: [deploy-dev, detect-changes]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      ((github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'stg' && github.event.inputs.action == 'apply'))
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.detect-changes.outputs.changed-modules)) }}
    environment:
      name: staging
      url: https://console.aws.amazon.com/vpc/home?region=us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-stg
          path: ./infrastructure/terraform/${{ matrix.module }}/

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/${{ matrix.module }}/stg/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform apply -auto-approve stg.tfplan

      - name: Save Outputs
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform output -json > outputs.json
          echo "📊 Staging Terraform Outputs (${{ matrix.module }}):"
          cat outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ matrix.module }}-stg
          path: ./infrastructure/terraform/${{ matrix.module }}/outputs.json
          retention-days: 30

  # Progressive Deployment: Production Environment (Manual approval required)
  deploy-production:
    name: 'Deploy to Production'
    needs: [deploy-staging, detect-changes]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prd' && github.event.inputs.action == 'apply'
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.detect-changes.outputs.changed-modules)) }}
    environment:
      name: production
      url: https://console.aws.amazon.com/vpc/home?region=us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.module }}-prd
          path: ./infrastructure/terraform/${{ matrix.module }}/

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/${{ matrix.module }}/prd/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Apply
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform apply -auto-approve prd.tfplan

      - name: Save Outputs
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform output -json > outputs.json
          echo "📊 Production Terraform Outputs (${{ matrix.module }}):"
          cat outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ matrix.module }}-prd
          path: ./infrastructure/terraform/${{ matrix.module }}/outputs.json
          retention-days: 30

  terraform-destroy:
    name: 'Terraform Destroy'
    needs: [setup-backend, detect-changes]
    runs-on: ubuntu-latest
    if: |
      needs.detect-changes.outputs.has-changes == 'true' &&
      github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    strategy:
      matrix:
        module: ${{ fromJSON(format('[{0}]', needs.detect-changes.outputs.changed-modules)) }}
    environment:
      name: ${{ github.event.inputs.target_environment }}-destroy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform init \
            -backend-config="bucket=$S3_BUCKET" \
            -backend-config="key=terraform/${{ matrix.module }}/${{ github.event.inputs.target_environment }}/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"

      - name: Terraform Destroy
        working-directory: ./infrastructure/terraform/${{ matrix.module }}
        run: |
          terraform destroy -auto-approve \
            -var-file="env/${{ github.event.inputs.target_environment }}.tfvars"

  # Deployment Summary
  deployment-summary:
    name: 'Deployment Summary'
    runs-on: ubuntu-latest
    needs: [deploy-dev, deploy-staging, deploy-production, detect-changes]
    if: always() && needs.detect-changes.outputs.has-changes == 'true'

    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## 🚀 Terraform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Modules" >> $GITHUB_STEP_SUMMARY
          echo "**Modules:** ${{ needs.detect-changes.outputs.changed-modules }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Development | ${{ needs.deploy-dev.result == 'success' && '✅ Deployed' || needs.deploy-dev.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | ${{ needs.deploy-dev.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging | ${{ needs.deploy-staging.result == 'success' && '✅ Deployed' || needs.deploy-staging.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ needs.deploy-production.result == 'success' && '✅ Deployed' || needs.deploy-production.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [AWS Console](https://console.aws.amazon.com/vpc/home?region=us-east-1)" >> $GITHUB_STEP_SUMMARY
          echo "- [S3 Terraform State](https://s3.console.aws.amazon.com/s3/buckets/github-actions-kargo-argocd)" >> $GITHUB_STEP_SUMMARY
          echo "- [Terraform Outputs Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Deployment Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Terraform Version**: ${{ env.TF_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **AWS Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
