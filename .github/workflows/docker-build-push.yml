name: Build and Push to AWS ECR

on:
  push:
    branches: [ main, master ]
    paths:
      - 'applications/**'
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Required for OIDC

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 992382364873.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: kargo-argocd

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Docker image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./applications
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./applications

        # Push Docker images
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        echo "✅ Images pushed:"
        echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
